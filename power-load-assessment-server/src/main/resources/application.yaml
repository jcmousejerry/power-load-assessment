server:
  port: 8081
spring:
  application:
    name: power-load-assessment
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/power_load_assessment_db?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略null字段
mybatis-plus:
  type-aliases-package: com.chen.entity # 别名扫描包
logging:
  level:
    com.chen.server: debug