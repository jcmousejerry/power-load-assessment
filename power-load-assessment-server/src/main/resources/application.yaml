server:
  port: 8081
  tomcat:
    max-http-form-post-size: 100MB  # 增加表单提交大小限制
spring:
  kafka:
    bootstrap-servers: localhost:9092 # Kafka服务器地址
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        linger.ms: 5
        batch.size: 16384
    consumer:
      group-id: task-notification-group  # 与 @KafkaListener 中的 groupId 一致
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.chen.server.entity"
        enable.auto.commit: false         # 关闭自动提交偏移量
        auto.commit.interval.ms: 10000    # 若启用自动提交则增大提交间隔
        session.timeout.ms: 30000         # 增大会话超时时间
        heartbeat.interval.ms: 5000       # 增大心跳间隔
        max.poll.interval.ms: 600000      # 增大 poll 间隔时间
        max.poll.records: 100             # 减少每次拉取的记录数
  application:
    name: power-load-assessment
  servlet:
    multipart:
      max-file-size: 100MB          # 单个文件大小限制
      max-request-size: 100MB       # 整个请求大小限制
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/power_load_assessment_db?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略null字段
mybatis-plus:
  type-aliases-package: com.chen.entity # 别名扫描包
logging:
  level:
    com.chen.server: debug
minio:
  endpoint: http://localhost:9000 # MinIO服务地址
  access-key: minioadmin # 访问密钥
  secret-key: minioadmin # 秘密密钥
  bucket-name: power-load-assessment
